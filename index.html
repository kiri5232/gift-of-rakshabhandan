<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ek Dhaaga, Hazaar Kahaniyan 🧵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1E3D;
    --maroon-deep:#4A0E24;
    --marigold:#E8A33D;
    --marigold-deep:#B5691C;
    --teal:#1F5C4F;
    --ivory:#FBF3E7;
    --gold:#C9963C;
    --ink:#2B1B1F;
    --paper:#FFFCF6;
    --plum:#3A0E29;
    --saffron:#F2971F;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  html.locked, html.locked body{overflow:hidden;height:100%;}

  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  ::selection{background:var(--marigold);color:var(--maroon-deep);}

  a:focus-visible, button:focus-visible, .rakhi-item:focus-visible, .promise:focus-visible{
    outline:3px solid var(--teal);
    outline-offset:3px;
  }

  h1,h2,h3{font-family:'Yatra One',cursive;font-weight:400;line-height:1.15;}

  .eyebrow{
    font-family:'Poppins',sans-serif;
    text-transform:uppercase;
    letter-spacing:.28em;
    font-size:.72rem;
    font-weight:600;
    color:var(--teal);
  }

  section{position:relative;padding:5.5rem 1.5rem;max-width:920px;margin:0 auto;}

  /* ================= AMBIENT FESTIVE BACKGROUND ================= */
  .bg-scene{
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;
    overflow:hidden;
    background:
      radial-gradient(circle at 12% 8%, rgba(232,163,61,.30), transparent 40%),
      radial-gradient(circle at 90% 18%, rgba(122,30,61,.28), transparent 42%),
      radial-gradient(circle at 20% 92%, rgba(31,92,79,.20), transparent 45%),
      radial-gradient(circle at 88% 88%, rgba(242,151,31,.24), transparent 45%),
      linear-gradient(180deg,#FDF6E9 0%, #FBF0DD 35%, #F7E6CC 65%, #F3DCC0 100%);
  }

  .bg-scene svg.rangoli-tile{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:.10;
  }

  .bg-scene .thread-trail{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    opacity:.55;
  }
  .bg-scene .thread-trail path{
    fill:none;
    stroke:var(--gold);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-dasharray:5 9;
  }

  .petal{
    position:absolute;
    top:-6vh;
    width:14px;
    height:14px;
    background:radial-gradient(circle at 30% 30%, var(--marigold), var(--marigold-deep) 75%);
    border-radius:0 60% 0 60%;
    opacity:.55;
    animation:drift linear infinite;
    will-change:transform;
  }
  .petal.alt{
    background:radial-gradient(circle at 30% 30%, #e0748f, var(--maroon) 75%);
  }
  @keyframes drift{
    0%{transform:translate(0,0) rotate(0deg);}
    100%{transform:translate(var(--dx,40px), 118vh) rotate(340deg);}
  }

  @media (prefers-reduced-motion: reduce){
    .petal{animation:none; opacity:.25;}
  }

  /* ================= GIFT GATE ================= */
  #giftGate{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.6rem;
    text-align:center;
    padding:2rem;
    background:
      radial-gradient(circle at 50% 30%, rgba(232,163,61,.35), transparent 55%),
      linear-gradient(160deg, var(--plum) 0%, var(--maroon-deep) 45%, #2a0a1c 100%);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #giftGate.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .gate-eyebrow{
    color:var(--marigold);
    text-transform:uppercase;
    letter-spacing:.3em;
    font-size:.72rem;
    font-weight:600;
  }
  .gate-title{
    font-family:'Yatra One',cursive;
    color:var(--ivory);
    font-size:clamp(1.6rem,5.5vw,2.4rem);
    max-width:16ch;
  }
  .gate-title span{color:var(--marigold);}

  #giftBtn{
    background:none;
    border:none;
    cursor:pointer;
    padding:1rem;
    -webkit-tap-highlight-color:transparent;
  }
  #giftBtn svg{width:min(230px,58vw);height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));}

  .lid-group{transform-origin:110px 96px;transition:transform .55s cubic-bezier(.34,1.56,.64,1), opacity .5s ease .1s;}
  .ribbon-h{transition:transform .5s ease .05s, opacity .4s ease .05s;}
  .ribbon-v-l{transition:transform .5s ease .1s, opacity .4s ease .1s;}
  .ribbon-v-r{transition:transform .5s ease .1s, opacity .4s ease .1s;}
  .bow-group{transition:transform .45s ease, opacity .35s ease;}
  .box-shine{transition:opacity .4s ease .2s;}

  #giftGate.opening .lid-group{transform:translateY(-58px) rotate(-18deg); opacity:0;}
  #giftGate.opening .bow-group{transform:translateY(-58px) scale(.5); opacity:0;}
  #giftGate.opening .ribbon-h{transform:scaleX(0); opacity:0;}
  #giftGate.opening .ribbon-v-l{transform:translateX(-30px) rotate(-25deg); opacity:0;}
  #giftGate.opening .ribbon-v-r{transform:translateX(30px) rotate(25deg); opacity:0;}
  #giftGate.opening .box-shine{opacity:0;}

  .burst{
    position:absolute;
    top:50%; left:50%;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--marigold);
    opacity:0;
    pointer-events:none;
  }
  #giftGate.opening .burst{
    animation:burstOut .8s ease-out forwards;
  }
  @keyframes burstOut{
    0%{opacity:1; transform:translate(-50%,-50%) scale(.4);}
    100%{opacity:0; transform:translate(calc(-50% + var(--bx))) translateY(calc(-50% + var(--by))) scale(1.1);}
  }

  .gate-hint{
    color:rgba(251,243,231,.75);
    font-size:.88rem;
    letter-spacing:.03em;
  }

  @media (prefers-reduced-motion: reduce){
    #giftGate{transition:opacity .01ms;}
    .lid-group,.ribbon-h,.ribbon-v-l,.ribbon-v-r,.bow-group,.box-shine,.burst{transition:none !important; animation:none !important;}
    #giftGate.opening{opacity:0; visibility:hidden;}
  }

  /* ---------- Thread divider (signature element) ---------- */
  .thread-divider{
    width:100%;
    height:46px;
    display:block;
    margin:0 auto;
  }
  .thread-divider path{
    fill:none;
    stroke:var(--gold);
    stroke-width:2.5;
    stroke-linecap:round;
  }

  /* ---------- HERO ---------- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem 1.5rem;
  }

  .rakhi-svg{width:min(220px,55vw);height:auto;margin-bottom:1.5rem;}

  .thread-path{
    stroke-dasharray:600;
    stroke-dashoffset:600;
  }
  .bow-bit{
    opacity:0;
    transform-origin:110px 110px;
  }
  html.gate-opened .thread-path{animation:tieThread 2.2s ease-out forwards .2s;}
  html.gate-opened .bow-bit{animation:popBow .5s ease-out forwards 1.9s;}
  @keyframes tieThread{to{stroke-dashoffset:0;}}
  @keyframes popBow{
    0%{opacity:0;transform:scale(.4);}
    70%{opacity:1;transform:scale(1.12);}
    100%{opacity:1;transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .thread-path{stroke-dashoffset:0;}
    .bow-bit{opacity:1;transform:scale(1);}
  }

  .hero h1{
    font-size:clamp(2.2rem,6vw,3.8rem);
    color:var(--maroon);
    max-width:14ch;
    margin:.4rem 0 1rem;
  }
  .hero h1 span{color:var(--marigold-deep);}

  .hero p.sub{
    font-size:1.05rem;
    color:#5a4650;
    max-width:36ch;
    margin-bottom:2.2rem;
  }

  .scroll-cue{
    font-size:.85rem;
    color:var(--teal);
    letter-spacing:.05em;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.4rem;
    animation:bob 2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(8px);}}

  /* ---------- SECTION HEADERS ---------- */
  .sec-head{text-align:center;margin-bottom:2.8rem;}
  .sec-head h2{font-size:clamp(1.8rem,4.5vw,2.6rem);color:var(--maroon);margin-top:.5rem;}
  .sec-head p{color:#6b5a63;max-width:46ch;margin:.7rem auto 0;font-size:.98rem;}

  /* ---------- RAKHI TAX CALCULATOR ---------- */
  .calc-card{
    background:var(--paper);
    border:1.5px solid rgba(201,150,60,.35);
    border-radius:22px;
    padding:2rem 1.6rem;
    box-shadow:0 18px 40px -22px rgba(122,30,61,.35);
  }
  .rakhi-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding:.9rem .2rem;
    border-bottom:1px dashed rgba(122,30,61,.18);
    cursor:pointer;
    background:none;
    border-left:none;border-right:none;border-top:none;
    width:100%;
    font-family:'Poppins',sans-serif;
    text-align:left;
  }
  .rakhi-item:last-of-type{border-bottom:none;}
  .rakhi-item .label{
    display:flex;align-items:center;gap:.8rem;
    font-size:.98rem;color:var(--ink);
  }
  .rakhi-item .checkbox{
    width:22px;height:22px;border-radius:7px;
    border:2px solid var(--gold);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:.8rem;color:var(--paper);
    transition:background .2s ease;
  }
  .rakhi-item.checked .checkbox{background:var(--teal);border-color:var(--teal);}
  .rakhi-item .price{font-weight:600;color:var(--maroon);font-size:.95rem;white-space:nowrap;}

  .calc-total{
    margin-top:1.6rem;
    padding-top:1.4rem;
    border-top:2px solid var(--maroon);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:.5rem;
  }
  .calc-total .amt{font-family:'Yatra One',cursive;font-size:2rem;color:var(--maroon);}
  .calc-total .verdict{font-size:.85rem;color:var(--teal);font-weight:600;max-width:22ch;text-align:right;}

  /* ---------- LETTER / ENVELOPE ---------- */
  .envelope-wrap{display:flex;flex-direction:column;align-items:center;}
  .envelope{
    width:min(320px,80vw);
    cursor:pointer;
    background:transparent;
    border:none;
    padding:0;
  }
  .envelope svg{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 26px rgba(122,30,61,.28));transition:transform .3s ease;}
  .envelope:hover svg{transform:translateY(-4px);}
  .envelope-label{margin-top:1rem;font-size:.9rem;color:var(--teal);font-weight:600;letter-spacing:.03em;}

  .letter{
    max-width:560px;
    margin:2.2rem auto 0;
    background:var(--paper);
    border-radius:4px;
    padding:2.6rem 2rem;
    box-shadow:0 20px 44px -22px rgba(122,30,61,.4);
    font-family:'Caveat',cursive;
    font-size:1.5rem;
    line-height:1.55;
    color:var(--maroon-deep);
    display:none;
    position:relative;
    border-left:5px solid var(--gold);
  }
  .letter.show{display:block;animation:unfold .55s ease;}
  @keyframes unfold{
    from{opacity:0;transform:translateY(14px) scale(.98);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .letter p{margin-bottom:1rem;}
  .letter .sign{text-align:right;font-size:1.6rem;color:var(--maroon);margin-top:.5rem;}

  /* ---------- PROMISES ---------- */
  .promise-list{list-style:none;display:flex;flex-direction:column;gap:.9rem;}
  .promise{
    display:flex;
    align-items:flex-start;
    gap:.9rem;
    background:var(--paper);
    border:1.5px solid rgba(31,92,79,.18);
    border-radius:16px;
    padding:1rem 1.2rem;
    cursor:pointer;
  }
  .promise .tick{
    width:24px;height:24px;border-radius:50%;
    border:2px solid var(--marigold-deep);
    flex-shrink:0;margin-top:.1rem;
    display:flex;align-items:center;justify-content:center;
    font-size:.85rem;color:var(--paper);
    transition:background .2s ease, border-color .2s ease;
  }
  .promise.done .tick{background:var(--teal);border-color:var(--teal);}
  .promise.done .txt{text-decoration:line-through;color:#8a7b82;}
  .promise .txt{font-size:.98rem;line-height:1.45;}
  .promise .txt b{color:var(--maroon);font-weight:600;}

  /* ---------- QUIZ ---------- */
  .quiz-card{
    background:var(--paper);
    border:1.5px solid rgba(201,150,60,.35);
    border-radius:22px;
    padding:1.8rem 1.5rem;
    box-shadow:0 18px 40px -22px rgba(122,30,61,.35);
    margin-bottom:1.2rem;
  }
  .quiz-card .q-num{
    font-size:.72rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:600;
  }
  .quiz-card .q-text{
    font-family:'Yatra One',cursive;
    font-size:1.25rem;
    color:var(--maroon);
    margin:.4rem 0 1.1rem;
  }
  .q-options{display:flex;flex-direction:column;gap:.65rem;}
  .q-opt{
    text-align:left;
    background:var(--ivory);
    border:1.5px solid rgba(122,30,61,.15);
    border-radius:12px;
    padding:.7rem .9rem;
    font-family:'Poppins',sans-serif;
    font-size:.92rem;
    color:var(--ink);
    cursor:pointer;
  }
  .q-opt:hover{border-color:var(--gold);}
  .q-opt.picked{background:var(--marigold);border-color:var(--marigold-deep);color:var(--maroon-deep);font-weight:600;}
  .q-opt:disabled{cursor:default;}
  .q-response{
    margin-top:.9rem;
    font-family:'Caveat',cursive;
    font-size:1.25rem;
    color:var(--teal);
    display:none;
  }
  .q-response.show{display:block;animation:unfold .4s ease;}

  .quiz-result{
    text-align:center;
    background:linear-gradient(135deg, var(--maroon), var(--maroon-deep));
    color:var(--ivory);
    border-radius:20px;
    padding:1.8rem 1.4rem;
    margin-top:.6rem;
    display:none;
  }
  .quiz-result.show{display:block;animation:unfold .5s ease;}
  .quiz-result .score{font-family:'Yatra One',cursive;font-size:1.6rem;color:var(--marigold);margin-bottom:.4rem;}
  .quiz-result p{font-size:.95rem;color:rgba(251,243,231,.9);max-width:38ch;margin:0 auto;}

  /* ---------- CONFESSION NOTES ---------- */
  .notes-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1rem;
  }
  .note-chit{
    background:var(--paper);
    border:1.5px dashed var(--gold);
    border-radius:4px;
    padding:1.2rem 1rem;
    cursor:pointer;
    min-height:104px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    transform:rotate(var(--tilt,0deg));
    box-shadow:0 10px 22px -14px rgba(122,30,61,.4);
    transition:transform .2s ease;
  }
  .note-chit:hover{transform:rotate(0deg) scale(1.02);}
  .note-chit .fold-label{
    font-size:.85rem;
    color:var(--teal);
    font-weight:600;
    letter-spacing:.03em;
  }
  .note-chit .note-txt{
    font-family:'Caveat',cursive;
    font-size:1.25rem;
    color:var(--maroon-deep);
    line-height:1.4;
    display:none;
  }
  .note-chit.open{cursor:default;align-items:flex-start;}
  .note-chit.open .fold-label{display:none;}
  .note-chit.open .note-txt{display:block;animation:unfold .4s ease;}

  /* ---------- EXCUSE GENERATOR ---------- */
  .excuse-card{
    background:var(--paper);
    border:1.5px solid rgba(201,150,60,.35);
    border-radius:22px;
    padding:2rem 1.6rem;
    text-align:center;
    box-shadow:0 18px 40px -22px rgba(122,30,61,.35);
  }
  .excuse-box{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Caveat',cursive;
    font-size:1.4rem;
    color:var(--maroon-deep);
    padding:0 .5rem;
    margin-bottom:1.4rem;
  }
  .excuse-box.show{animation:unfold .35s ease;}
  #excuseBtn{
    background:var(--teal);
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:.85rem 1.8rem;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:.92rem;
    cursor:pointer;
    letter-spacing:.02em;
  }
  #excuseBtn:hover{background:var(--maroon);}

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:4.5rem 1.5rem 3.5rem;
  }
  footer h3{color:var(--maroon);font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:.6rem;}
  footer p{color:#6b5a63;font-size:.95rem;max-width:40ch;margin:0 auto;}
  .footer-note{margin-top:1.6rem;font-family:'Caveat',cursive;font-size:1.4rem;color:var(--teal);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important;}
  }

  @media (max-width:640px){
    section{padding:4rem 1.2rem;}
    .calc-total{flex-direction:column;align-items:flex-start;}
    .calc-total .verdict{text-align:left;}
  }
</style>
</head>
<body>

<!-- AMBIENT BACKGROUND (sits behind everything) -->
<div class="bg-scene" aria-hidden="true">
  <svg class="rangoli-tile" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="rangoliDots" width="64" height="64" patternUnits="userSpaceOnUse">
        <circle cx="32" cy="8" r="2" fill="#7A1E3D"/>
        <circle cx="8" cy="32" r="2" fill="#E8A33D"/>
        <circle cx="56" cy="32" r="2" fill="#E8A33D"/>
        <circle cx="32" cy="56" r="2" fill="#7A1E3D"/>
        <circle cx="32" cy="32" r="2.6" fill="#1F5C4F"/>
        <path d="M32 8 Q40 24 56 32 Q40 40 32 56 Q24 40 8 32 Q24 24 32 8 Z" fill="none" stroke="#C9963C" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#rangoliDots)"/>
  </svg>
  <svg class="thread-trail" preserveAspectRatio="none" viewBox="0 0 400 2400" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 0 C 120 120, -20 220, 60 340 S 200 520, 100 640 S -20 820, 90 940 S 260 1100, 140 1240 S -10 1420, 100 1560 S 240 1760, 120 1900 S 10 2100, 110 2260 S 220 2380, 140 2400"/>
  </svg>
  <div class="petal" style="left:6%; --dx:60px; animation-duration:16s; animation-delay:0s;"></div>
  <div class="petal alt" style="left:18%; --dx:-40px; animation-duration:19s; animation-delay:2s;"></div>
  <div class="petal" style="left:32%; --dx:30px; animation-duration:14s; animation-delay:4s;"></div>
  <div class="petal alt" style="left:48%; --dx:-55px; animation-duration:21s; animation-delay:1s;"></div>
  <div class="petal" style="left:64%; --dx:45px; animation-duration:17s; animation-delay:5s;"></div>
  <div class="petal alt" style="left:78%; --dx:-30px; animation-duration:15s; animation-delay:3s;"></div>
  <div class="petal" style="left:88%; --dx:35px; animation-duration:20s; animation-delay:6s;"></div>
</div>

<!-- GIFT BOX GATE -->
<div id="giftGate">
  <p class="gate-eyebrow">Ek gift hai tumhare liye</p>
  <h1 class="gate-title">Isse <span>khol</span> ke dekho, behna</h1>
  <button id="giftBtn" aria-label="Gift box kholo">
    <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <rect class="box-shine" x="30" y="112" width="160" height="80" rx="6" fill="#8f2548"/>
      <rect x="30" y="112" width="160" height="80" rx="6" fill="#7A1E3D"/>
      <rect x="30" y="112" width="160" height="80" rx="6" fill="none" stroke="#4A0E24" stroke-width="2"/>

      <rect class="ribbon-v-l" x="98" y="112" width="10" height="80" fill="#1F5C4F"/>
      <rect class="ribbon-v-r" x="112" y="112" width="10" height="80" fill="#1F5C4F"/>

      <g class="lid-group">
        <rect x="22" y="88" width="176" height="28" rx="6" fill="#E8A33D"/>
        <rect x="22" y="88" width="176" height="28" rx="6" fill="none" stroke="#B5691C" stroke-width="2"/>
        <rect class="ribbon-h" x="22" y="97" width="176" height="10" fill="#1F5C4F"/>
      </g>

      <g class="bow-group">
        <circle cx="110" cy="92" r="20" fill="#E8A33D"/>
        <circle cx="110" cy="92" r="20" fill="none" stroke="#7A1E3D" stroke-width="3"/>
        <path d="M110 70 L90 50 L98 82 Z" fill="#7A1E3D"/>
        <path d="M110 70 L130 50 L122 82 Z" fill="#7A1E3D"/>
        <circle cx="110" cy="92" r="7" fill="#FBF3E7"/>
